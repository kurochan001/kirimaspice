<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Size of each Newton update for the RC-diode step</title>
  <desc id="desc">Starting from 0.550 V the updates are 22.6 mV, 12.4 mV, 2.40 mV, 66.0 microvolts and 46.9 nanovolts. The fourth update is the first below the tolerance of 0.51 mV.</desc>
  <rect width="640" height="300" rx="8" fill="#fff"/>
  <g font-family="sans-serif" font-size="13" fill="#192d3b">
    <line x1="86" y1="230" x2="606" y2="230" stroke="#dde4e8" stroke-width="1"/>
    <line x1="86" y1="201.43" x2="606" y2="201.43" stroke="#dde4e8" stroke-width="1"/>
    <line x1="86" y1="172.86" x2="606" y2="172.86" stroke="#dde4e8" stroke-width="1"/>
    <line x1="86" y1="144.29" x2="606" y2="144.29" stroke="#dde4e8" stroke-width="1"/>
    <line x1="86" y1="115.71" x2="606" y2="115.71" stroke="#dde4e8" stroke-width="1"/>
    <line x1="86" y1="87.14" x2="606" y2="87.14" stroke="#dde4e8" stroke-width="1"/>
    <line x1="86" y1="58.57" x2="606" y2="58.57" stroke="#dde4e8" stroke-width="1"/>
    <line x1="86" y1="30" x2="606" y2="30" stroke="#dde4e8" stroke-width="1"/>
    <line x1="86" y1="30" x2="86" y2="230" stroke="#233848" stroke-width="1"/>
    <line x1="86" y1="230" x2="606" y2="230" stroke="#233848" stroke-width="1"/>
    <line x1="138" y1="230" x2="138" y2="234" stroke="#233848" stroke-width="1"/>
    <text x="138" y="248" font-size="12" text-anchor="middle" fill="#52616c">1</text>
    <line x1="242" y1="230" x2="242" y2="234" stroke="#233848" stroke-width="1"/>
    <text x="242" y="248" font-size="12" text-anchor="middle" fill="#52616c">2</text>
    <line x1="346" y1="230" x2="346" y2="234" stroke="#233848" stroke-width="1"/>
    <text x="346" y="248" font-size="12" text-anchor="middle" fill="#52616c">3</text>
    <line x1="450" y1="230" x2="450" y2="234" stroke="#233848" stroke-width="1"/>
    <text x="450" y="248" font-size="12" text-anchor="middle" fill="#52616c">4</text>
    <line x1="554" y1="230" x2="554" y2="234" stroke="#233848" stroke-width="1"/>
    <text x="554" y="248" font-size="12" text-anchor="middle" fill="#52616c">5</text>
    <line x1="82" y1="230" x2="86" y2="230" stroke="#233848" stroke-width="1"/>
    <text x="78" y="234" font-size="12" text-anchor="end" fill="#52616c">10 nV</text>
    <line x1="82" y1="201.43" x2="86" y2="201.43" stroke="#233848" stroke-width="1"/>
    <text x="78" y="205.43" font-size="12" text-anchor="end" fill="#52616c">100 nV</text>
    <line x1="82" y1="172.86" x2="86" y2="172.86" stroke="#233848" stroke-width="1"/>
    <text x="78" y="176.86" font-size="12" text-anchor="end" fill="#52616c">1 µV</text>
    <line x1="82" y1="144.29" x2="86" y2="144.29" stroke="#233848" stroke-width="1"/>
    <text x="78" y="148.29" font-size="12" text-anchor="end" fill="#52616c">10 µV</text>
    <line x1="82" y1="115.71" x2="86" y2="115.71" stroke="#233848" stroke-width="1"/>
    <text x="78" y="119.71" font-size="12" text-anchor="end" fill="#52616c">100 µV</text>
    <line x1="82" y1="87.14" x2="86" y2="87.14" stroke="#233848" stroke-width="1"/>
    <text x="78" y="91.14" font-size="12" text-anchor="end" fill="#52616c">1 mV</text>
    <line x1="82" y1="58.57" x2="86" y2="58.57" stroke="#233848" stroke-width="1"/>
    <text x="78" y="62.57" font-size="12" text-anchor="end" fill="#52616c">10 mV</text>
    <line x1="82" y1="30" x2="86" y2="30" stroke="#233848" stroke-width="1"/>
    <text x="78" y="34" font-size="12" text-anchor="end" fill="#52616c">100 mV</text>
    <text x="346" y="268" text-anchor="middle">Newton iteration</text>
    <text x="20" y="130" text-anchor="middle" transform="rotate(-90 20 130)">Change of v</text>
    <line x1="86" y1="95.41" x2="606" y2="95.41" stroke="#6b7780" stroke-width="1.5"/>
    <text x="94" y="112.41" font-size="12" fill="#52616c">Tolerance RELTOL × |v| + VNTOL = 0.51 mV</text>
    <path d="M138 48.43 L242 55.86 L346 76.28 L450 120.87 L554 210.82" fill="none" stroke="#1b64be" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="138" cy="48.43" r="4" fill="#1b64be" stroke="#fff" stroke-width="2"/>
    <circle cx="242" cy="55.86" r="4" fill="#1b64be" stroke="#fff" stroke-width="2"/>
    <circle cx="346" cy="76.28" r="4" fill="#1b64be" stroke="#fff" stroke-width="2"/>
    <circle cx="450" cy="120.87" r="4" fill="#1b64be" stroke="#fff" stroke-width="2"/>
    <circle cx="554" cy="210.82" r="4" fill="#1b64be" stroke="#fff" stroke-width="2"/>
    <text x="148" y="40.43" font-size="12">22.6 mV</text>
    <text x="460" y="112.87" font-size="12">66.0 µV</text>
    <text x="564" y="202.82" font-size="12">46.9 nV</text>
  </g>
</svg>
