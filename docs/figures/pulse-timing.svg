<svg xmlns="http://www.w3.org/2000/svg" width="710" height="245" viewBox="0 0 710 245" role="img" aria-labelledby="title desc">
  <title id="title">PULSE(0 5 1u 1u 2u 3u 8u)</title>
  <desc id="desc">The voltage rises from 0 to 5 V between 1 and 2 microseconds, stays high until 5, and falls to 0 at 7. The next rise starts at 9 microseconds.</desc>
  <rect width="710" height="245" rx="8" fill="#fff"/>
  <g fill="none" stroke="#c8d3d8" stroke-dasharray="3 4">
    <path d="M80 56V183 M135 56V183 M190 56V183 M355 56V183 M465 56V183 M575 85V211 M630 85V183"/>
    <path d="M80 85H679 M80 151H679"/>
  </g>
  <g fill="none" stroke="#52616c" stroke-width="1.5">
    <path d="M80 70V178H683 M80 178v5 M135 178v5 M190 178v5 M355 178v5 M465 178v5 M575 178v5 M630 178v5"/>
    <path d="M76 85h4 M76 151h4"/>
  </g>
  <path d="M80 151h55l55 -66h165l110 66h110l55 -66h49" fill="none" stroke="#145c86" stroke-width="3.5" stroke-linejoin="round"/>
  <g fill="none" stroke="#137365" stroke-width="1.5">
    <path d="M80 51H465 M80 46v10 M135 46v10 M190 46v10 M355 46v10 M465 46v10"/>
    <path d="M135 207v10 M135 212H575 M575 207v10"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#243847">
    <g text-anchor="end">
      <text x="69" y="90">V2 = 5 V</text><text x="69" y="156">V1 = 0 V</text>
    </g>
    <g text-anchor="middle">
      <text x="80" y="201">0</text><text x="135" y="201">1</text><text x="190" y="201">2</text>
      <text x="355" y="201">5</text><text x="465" y="201">7</text><text x="575" y="201">9</text><text x="630" y="201">10</text>
      <g fill="#126556" font-weight="bold">
        <text x="107" y="39">TD</text><text x="162" y="39">TR</text>
        <text x="272" y="39">PW</text><text x="410" y="39">TF</text><text x="355" y="235">PER = 8 µs</text>
      </g>
    </g>
    <text x="654" y="201">t (µs)</text>
  </g>
</svg>
