<svg xmlns="http://www.w3.org/2000/svg" width="660" height="318" viewBox="0 0 660 318" role="img" aria-labelledby="title desc">
  <title id="title">Where R1, C1 and V1 write in the matrix and the right-hand side</title>
  <desc id="desc">Rows in, out and V1; columns v_in, v_out and i_V. R1 writes plus and minus g in the four positions of rows in and out and columns v_in and v_out. C1 writes G_C on the diagonal of out and G_C times v_n on the right-hand side of out. V1 writes 1 at row in, column i_V, 1 at row V1, column v_in, and V_s on the right-hand side of row V1.</desc>
  <rect width="660" height="318" rx="8" fill="#fff"/>
  <g font-family="sans-serif" font-size="13" fill="#192d3b">
