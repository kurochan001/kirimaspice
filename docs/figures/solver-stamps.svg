    <text x="619" y="164" font-size="12.5" text-anchor="end">+G<tspan dy="4" font-size="9">C</tspan><tspan dy="-4" font-size="13">​</tspan> v<tspan dy="4" font-size="9">n</tspan><tspan dy="-4" font-size="13">​</tspan></text>
