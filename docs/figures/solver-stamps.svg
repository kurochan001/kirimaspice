    <text x="260" y="54" text-anchor="middle" font-style="italic">v<tspan dy="4" font-size="9">out</tspan><tspan dy="-4" font-size="13">​</tspan></text>
    <text x="348" y="54" text-anchor="middle" font-style="italic">i<tspan dy="4" font-size="9">V</tspan><tspan dy="-4" font-size="13">​</tspan></text>
    <text x="260" y="30" font-size="12" text-anchor="middle" fill="#52616c">Matrix G: one column per unknown</text>
    <text x="452" y="54" text-anchor="middle" font-style="italic">x</text>
    <text x="574" y="54" text-anchor="middle" font-style="italic">b</text>
    <text x="574" y="30" font-size="12" text-anchor="middle" fill="#52616c">Right-hand side</text>
    <text x="110" y="98" text-anchor="end" font-weight="bold">in</text>
    <text x="110" y="114" font-size="11" text-anchor="end" fill="#52616c">KCL, in A</text>
    <text x="110" y="158" text-anchor="end" font-weight="bold">out</text>
    <text x="110" y="174" font-size="11" text-anchor="end" fill="#52616c">KCL, in A</text>
    <text x="110" y="218" text-anchor="end" font-weight="bold">V1</text>
    <text x="110" y="234" font-size="11" text-anchor="end" fill="#52616c">constraint, in V</text>
