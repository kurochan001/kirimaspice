    <text x="65" y="286" font-size="12">R1: g = 1/R</text>
    <rect x="158.5" y="274" width="18" height="14" rx="3" fill="#f7e4d8" stroke="#a44919" stroke-width="1.2"/>
    <text x="183.5" y="286" font-size="12">C1: backward-Euler companion</text>
    <rect x="387.5" y="274" width="18" height="14" rx="3" fill="#d8efe9" stroke="#00856f" stroke-width="1.2"/>
