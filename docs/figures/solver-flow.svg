<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" viewBox="0 0 760 352" role="img" aria-labelledby="title desc">
  <title id="title">From a netlist to a waveform</title>
  <desc id="desc">The parser turns the netlist into a circuit of devices. The solver repeats two nested loops: for each time point, devices stamp the matrix G and the vector b at a trial solution, KLU solves G x = b, and the solution is checked. A solution that has not converged becomes the next trial. A converged one is accepted, the devices store their history, and time advances. The accepted points go to the output files.</desc>
  <rect width="760" height="352" rx="8" fill="#fff"/>
  <g font-family="sans-serif" font-size="13" fill="#192d3b">
    <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#233848"/></marker></defs>
    <defs><marker id="arrow2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#126757"/></marker></defs>
    <rect x="17" y="18" width="126" height="50" rx="6" fill="#f3f6f8" stroke="#233848" stroke-width="1.5"/>
    <text x="80" y="39" text-anchor="middle" font-weight="bold">Netlist</text>
    <text x="80" y="56" font-size="11.5" text-anchor="middle" fill="#52616c">.cir text file</text>
    <rect x="167" y="18" width="126" height="50" rx="6" fill="#f3f6f8" stroke="#233848" stroke-width="1.5"/>
    <text x="230" y="39" text-anchor="middle" font-weight="bold">Parser</text>
    <text x="230" y="56" font-size="11.5" text-anchor="middle" fill="#52616c">reads each line</text>
    <rect x="317" y="18" width="126" height="50" rx="6" fill="#f3f6f8" stroke="#233848" stroke-width="1.5"/>
    <text x="380" y="39" text-anchor="middle" font-weight="bold">Circuit</text>
    <text x="380" y="56" font-size="11.5" text-anchor="middle" fill="#52616c">nodes and devices</text>
    <rect x="467" y="18" width="126" height="50" rx="6" fill="#f3f6f8" stroke="#233848" stroke-width="1.5"/>
    <text x="530" y="39" text-anchor="middle" font-weight="bold">Solver</text>
    <text x="530" y="56" font-size="11.5" text-anchor="middle" fill="#52616c">DC, transient or AC</text>
    <rect x="617" y="18" width="126" height="50" rx="6" fill="#f3f6f8" stroke="#233848" stroke-width="1.5"/>
    <text x="680" y="39" text-anchor="middle" font-weight="bold">Output</text>
    <text x="680" y="56" font-size="11.5" text-anchor="middle" fill="#52616c">raw, CSV, SSF files</text>
    <path d="M143 43 L167 43" fill="none" stroke="#233848" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M293 43 L317 43" fill="none" stroke="#233848" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M443 43 L467 43" fill="none" stroke="#233848" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M593 43 L617 43" fill="none" stroke="#233848" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="17" y="104" width="726" height="236" rx="10" fill="none" stroke="#6b7780" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="31" y="126" font-weight="bold">Time loop (transient): one pass per time point</text>
    <rect x="37" y="142" width="498" height="148" rx="10" fill="none" stroke="#126757" stroke-width="1.5"/>
    <text x="51" y="164" fill="#126757" font-weight="bold">Newton loop: one pass per trial solution x</text>
    <line x1="530" y1="68" x2="530" y2="104" stroke="#6b7780" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="53" y="178" width="142" height="62" rx="6" fill="#eef6f3" stroke="#126757" stroke-width="1.5"/>
    <text x="124" y="199" text-anchor="middle" font-weight="bold">Stamp</text>
    <text x="124" y="216" font-size="11.5" text-anchor="middle" fill="#52616c">each device adds its</text>
    <text x="124" y="231" font-size="11.5" text-anchor="middle" fill="#52616c">terms to G and b</text>
    <rect x="215" y="178" width="142" height="62" rx="6" fill="#eef6f3" stroke="#126757" stroke-width="1.5"/>
    <text x="286" y="199" text-anchor="middle" font-weight="bold">Solve</text>
    <text x="286" y="216" font-size="11.5" text-anchor="middle" fill="#52616c">KLU factors G and</text>
    <text x="286" y="231" font-size="11.5" text-anchor="middle" fill="#52616c">solves G x = b</text>
    <rect x="377" y="178" width="142" height="62" rx="6" fill="#eef6f3" stroke="#126757" stroke-width="1.5"/>
    <text x="448" y="199" text-anchor="middle" font-weight="bold">Check</text>
    <text x="448" y="216" font-size="11.5" text-anchor="middle" fill="#52616c">change and residual</text>
    <text x="448" y="231" font-size="11.5" text-anchor="middle" fill="#52616c">small, no limiting</text>
    <path d="M195 209 L215 209" fill="none" stroke="#233848" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M357 209 L377 209" fill="none" stroke="#233848" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M448 240 L448 264 L124 264 L124 241" fill="none" stroke="#126757" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow2)"/>
    <text x="286" y="281" font-size="12" text-anchor="middle">not converged: the new x is the next trial</text>
    <rect x="600" y="178" width="136" height="62" rx="6" fill="#f3f6f8" stroke="#233848" stroke-width="1.5"/>
    <text x="668" y="199" text-anchor="middle" font-weight="bold">Accept</text>
    <text x="668" y="216" font-size="11.5" text-anchor="middle" fill="#52616c">devices store this</text>
    <text x="668" y="231" font-size="11.5" text-anchor="middle" fill="#52616c">point's history</text>
    <path d="M519 209 L600 209" fill="none" stroke="#233848" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="568" y="200" font-size="12" text-anchor="middle">converged</text>
    <path d="M668 240 L668 312 L27 312 L27 209 L53 209" fill="none" stroke="#233848" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="343" y="329" font-size="12" text-anchor="middle">next time point: t + h</text>
    <path d="M690 178 L690 69" fill="none" stroke="#233848" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="682" y="148" font-size="12" text-anchor="end">accepted points</text>
  </g>
</svg>
