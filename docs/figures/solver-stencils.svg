<svg xmlns="http://www.w3.org/2000/svg" width="700" height="318" viewBox="0 0 700 318" role="img" aria-labelledby="title desc">
  <title id="title">Stored points that each integration formula uses</title>
  <desc id="desc">Backward Euler uses the voltage at t_n. The trapezoidal rule uses the voltage and the current at t_n. BDF2 uses the voltages at t_n and t_n-1, BDF3 also the voltage at t_n-2. TR-BDF2 first solves the point t_n + gamma h with the trapezoidal rule, then t_n+1 with a BDF2 formula over t_n and that intermediate point.</desc>
  <rect width="700" height="318" rx="8" fill="#fff"/>
  <g font-family="sans-serif" font-size="13" fill="#192d3b">
    <line x1="288" y1="50" x2="664" y2="50" stroke="#233848" stroke-width="1"/>
    <path d="M664 46 l8 4 -8 4z" fill="#233848"/>
    <text x="678" y="54" font-style="italic">t</text>
    <line x1="318" y1="46" x2="318" y2="54" stroke="#233848" stroke-width="1"/>
    <text x="318" y="38" font-size="12.5" text-anchor="middle" font-style="italic">t<tspan dy="4" font-size="9">n−2</tspan><tspan dy="-4" font-size="13">​</tspan></text>
    <line x1="318" y1="62" x2="318" y2="258" stroke="#dde4e8" stroke-width="1"/>
    <line x1="420" y1="46" x2="420" y2="54" stroke="#233848" stroke-width="1"/>
    <text x="420" y="38" font-size="12.5" text-anchor="middle" font-style="italic">t<tspan dy="4" font-size="9">n−1</tspan><tspan dy="-4" font-size="13">​</tspan></text>
    <line x1="420" y1="62" x2="420" y2="258" stroke="#dde4e8" stroke-width="1"/>
    <line x1="522" y1="46" x2="522" y2="54" stroke="#233848" stroke-width="1"/>
    <text x="522" y="38" font-size="12.5" text-anchor="middle" font-style="italic">t<tspan dy="4" font-size="9">n</tspan><tspan dy="-4" font-size="13">​</tspan></text>
    <line x1="522" y1="62" x2="522" y2="258" stroke="#dde4e8" stroke-width="1"/>
    <line x1="581.75" y1="46" x2="581.75" y2="54" stroke="#233848" stroke-width="1"/>
    <text x="581.75" y="38" font-size="12.5" text-anchor="middle" font-style="italic">t<tspan dy="4" font-size="9">n</tspan><tspan dy="-4" font-size="13">​</tspan> + γh</text>
    <line x1="581.75" y1="62" x2="581.75" y2="258" stroke="#dde4e8" stroke-width="1"/>
    <line x1="624" y1="46" x2="624" y2="54" stroke="#233848" stroke-width="1"/>
    <text x="624" y="38" font-size="12.5" text-anchor="middle" font-style="italic">t<tspan dy="4" font-size="9">n+1</tspan><tspan dy="-4" font-size="13">​</tspan></text>
    <line x1="624" y1="62" x2="624" y2="258" stroke="#dde4e8" stroke-width="1"/>
    <text x="24" y="80" font-weight="bold">Backward Euler</text>
    <text x="178" y="80" font-size="12" fill="#52616c">order 1</text>
    <line x1="522" y1="76" x2="624" y2="76" stroke="#233848" stroke-width="1.5"/>
    <circle cx="522" cy="76" r="5" fill="#233848"/>
    <circle cx="624" cy="76" r="6" fill="#fff" stroke="#126757" stroke-width="2.5"/>
    <text x="24" y="114" font-weight="bold">Trapezoidal</text>
    <text x="178" y="114" font-size="12" fill="#52616c">order 2</text>
    <line x1="522" y1="110" x2="624" y2="110" stroke="#233848" stroke-width="1.5"/>
    <circle cx="522" cy="110" r="8.5" fill="#fff" stroke="#233848" stroke-width="1.5"/>
    <circle cx="522" cy="110" r="5" fill="#233848"/>
    <circle cx="624" cy="110" r="6" fill="#fff" stroke="#126757" stroke-width="2.5"/>
    <text x="24" y="148" font-weight="bold">BDF2 (GEAR2)</text>
    <text x="178" y="148" font-size="12" fill="#52616c">order 2</text>
    <line x1="420" y1="144" x2="624" y2="144" stroke="#233848" stroke-width="1.5"/>
    <circle cx="420" cy="144" r="5" fill="#233848"/>
    <circle cx="522" cy="144" r="5" fill="#233848"/>
    <circle cx="624" cy="144" r="6" fill="#fff" stroke="#126757" stroke-width="2.5"/>
    <text x="24" y="182" font-weight="bold">BDF3 (GEAR3)</text>
    <text x="178" y="182" font-size="12" fill="#52616c">order 3</text>
    <line x1="318" y1="178" x2="624" y2="178" stroke="#233848" stroke-width="1.5"/>
    <circle cx="318" cy="178" r="5" fill="#233848"/>
    <circle cx="420" cy="178" r="5" fill="#233848"/>
    <circle cx="522" cy="178" r="5" fill="#233848"/>
    <circle cx="624" cy="178" r="6" fill="#fff" stroke="#126757" stroke-width="2.5"/>
    <text x="24" y="216" font-weight="bold">TR-BDF2, stage 1</text>
    <text x="178" y="216" font-size="12" fill="#52616c">trapezoidal</text>
    <line x1="522" y1="212" x2="581.75" y2="212" stroke="#233848" stroke-width="1.5"/>
    <circle cx="522" cy="212" r="8.5" fill="#fff" stroke="#233848" stroke-width="1.5"/>
    <circle cx="522" cy="212" r="5" fill="#233848"/>
    <circle cx="581.75" cy="212" r="6" fill="#fff" stroke="#126757" stroke-width="2.5"/>
    <text x="24" y="250" font-weight="bold">TR-BDF2, stage 2</text>
    <text x="178" y="250" font-size="12" fill="#52616c">BDF2 formula</text>
    <line x1="522" y1="246" x2="624" y2="246" stroke="#233848" stroke-width="1.5"/>
    <circle cx="522" cy="246" r="5" fill="#233848"/>
    <circle cx="581.75" cy="246" r="5" fill="#233848"/>
    <circle cx="624" cy="246" r="6" fill="#fff" stroke="#126757" stroke-width="2.5"/>
    <circle cx="32" cy="290" r="5" fill="#233848"/>
    <text x="46" y="294" font-size="12">stored voltage</text>
    <circle cx="170" cy="290" r="8.5" fill="#fff" stroke="#233848" stroke-width="1.5"/><circle cx="170" cy="290" r="5" fill="#233848"/>
    <text x="186" y="294" font-size="12">stored voltage and current</text>
    <circle cx="378" cy="290" r="6" fill="#fff" stroke="#126757" stroke-width="2.5"/>
    <text x="392" y="294" font-size="12">point that the formula solves</text>
  </g>
</svg>
