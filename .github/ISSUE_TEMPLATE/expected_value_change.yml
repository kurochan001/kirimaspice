name: "Expected value change / 期待値の変更"
description: "Report that an existing test's expected value may be wrong / 既存テストの期待値が誤っている可能性の報告"
labels: ["expected-value"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not post commercial simulator outputs or diagnostics. / 商用シミュレータの出力・診断は投稿しないでください。**

        Keep them out of the body, comments, attachments, screenshots, waveforms and linked resources,
        including anonymized excerpts, summaries and results run by others. Do not run a commercial simulator or ask others to run one for this report.
        Explain expected behaviour in your own words, with the section of the model's specification or an analytic solution and a netlist you wrote yourself.
        Do not reproduce text of standards, papers or manuals, others' code, or confidential information such as foundry model parameters.

        本文・コメント・添付・画像・波形・リンク先に、匿名化した抜粋・要約や他の人が実行した結果も含めないでください。
        この報告のために商用シミュレータを実行したり、他の投稿者へ実行を求めたりしないでください。
        期待する動作は、モデルの仕様の節か解析解と、自分で書いたネットリストで、自分の言葉で説明してください。
        規格書・論文・マニュアルの本文、他人のコード、ファウンドリのモデルのパラメーターのような機密情報も転載しないでください。

        [Posting policy](https://github.com/kurochan001/kirimaspice/blob/main/docs/FAQ.md#may-i-include-commercial-simulator-output-in-an-issue) · [投稿方針](https://github.com/kurochan001/kirimaspice/blob/main/docs/FAQ.ja.md#%E5%95%86%E7%94%A8%E3%82%B7%E3%83%9F%E3%83%A5%E3%83%AC%E3%83%BC%E3%82%BF%E3%81%AE%E5%87%BA%E5%8A%9B%E3%82%92-issue-%E3%81%AB%E8%BC%89%E3%81%9B%E3%81%A6%E3%82%88%E3%81%84%E3%81%A7%E3%81%99%E3%81%8B)
  - type: checkboxes
    id: posting-policy
    attributes:
      label: "Before posting / 投稿前の確認"
      options:
        - label: "I have excluded commercial simulator outputs and diagnostics and will keep them out of comments and attachments. / 商用シミュレータの出力・診断を含めず、コメント・添付にも持ち込まないことを確認しました。"
          required: true
  - type: input
    id: expectation
    attributes:
      label: "Which expectation / 対象の期待値"
      description: "Test file and test name, for example tests/unit/test_dc_solver.cpp, DCSolver.VoltageDivider. / テストファイルとテストの名前を指定してください（例 tests/unit/test_dc_solver.cpp の DCSolver.VoltageDivider）。"
    validations:
      required: true
  - type: textarea
    id: values
    attributes:
      label: "Current and proposed value / 現在と提案する値"
      description: "State the current expectation and the proposed replacement. / 現在の期待値と、置き換える値を記載してください。"
      value: |
        - Current / 現在:
        - Proposed / 提案:
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: "Reason / 理由"
      description: "Cite the section of the model's specification or give the analytic solution, and explain in your own words. / モデルの仕様の節を挙げるか解析解を示し、自分の言葉で説明してください。"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Evidence / 根拠"
      description: "Give independent reasoning and evidence permitted by the posting policy, with tool versions where relevant. Exclude commercial simulator outputs and diagnostics. / 独立した説明と投稿方針で認める証拠を示し、必要ならツールの版を添えてください。商用シミュレータの出力・診断は除いてください。"
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Changes to existing expectations are made in their own commit, with no implementation changes under `src/`, and need a person's approval (see [CONTRIBUTING.md](https://github.com/kurochan001/kirimaspice/blob/main/CONTRIBUTING.md)).
        既存の期待値の変更は `src/` の実装の変更を含めず、専用のコミットで行い、人の承認が必要です
        （[CONTRIBUTING.ja.md](https://github.com/kurochan001/kirimaspice/blob/main/CONTRIBUTING.ja.md)）。
